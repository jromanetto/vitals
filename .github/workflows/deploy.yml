name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: cursor
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd /home/script/vitals
            git fetch origin main
            git reset --hard origin/main
            export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
            npm ci --no-audit --no-fund
            npm run build
            if pm2 describe vitals > /dev/null 2>&1; then
              pm2 restart vitals --update-env
            else
              pm2 start npm --name vitals -- start
              pm2 save
            fi
            sleep 6
            curl -fsS http://127.0.0.1:3015/api/health-check
            echo ""
            echo "Deployed at $(date -u)"

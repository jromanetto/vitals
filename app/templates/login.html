{% extends "base.html" %}
{% block title %}Login — Vitals{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-20">
  <div class="bg-panel border border-border rounded-lg p-8">
    <h1 class="text-2xl font-semibold mb-2 flex items-center gap-2">
      <span class="text-accent">●</span> Vitals
    </h1>
    <p class="text-muted text-sm mb-6">Données de santé personnelles</p>
    {% if error %}
    <div class="mb-4 p-3 bg-red-900/30 border border-red-800 rounded text-sm text-red-300">
      Identifiants invalides
    </div>
    {% endif %}
    <form method="post" action="/login" class="space-y-4">
      <div>
        <label class="block text-sm text-muted mb-1">Email</label>
        <input type="email" name="email" required autofocus
          class="w-full bg-bg border border-border rounded px-3 py-2 focus:border-accent focus:outline-none">
      </div>
      <div>
        <label class="block text-sm text-muted mb-1">Mot de passe</label>
        <input type="password" name="password" required
          class="w-full bg-bg border border-border rounded px-3 py-2 focus:border-accent focus:outline-none">
      </div>
      <button type="submit"
        class="w-full bg-accent hover:bg-emerald-600 text-black font-medium py-2 rounded transition">
        Se connecter
      </button>
    </form>
  </div>
</div>
{% endblock %}

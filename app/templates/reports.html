{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-semibold mb-6">Tous les rapports PDF</h1>
<div class="bg-panel border border-border rounded-lg divide-y divide-border">
  {% for r in reports %}
  <a href="/browse/{{ r.rel }}" target="_blank"
     class="flex items-center justify-between px-4 py-3 hover:bg-bg transition">
    <div class="flex items-center gap-3 min-w-0">
      <span class="text-red-400">📄</span>
      <span class="truncate">{{ r.name }}</span>
    </div>
    <div class="flex items-center gap-4 text-sm text-muted flex-shrink-0 ml-4">
      <span>{{ r.mtime }}</span>
      <span class="w-20 text-right">{{ r.size }}</span>
    </div>
  </a>
  {% endfor %}
</div>
{% endblock %}

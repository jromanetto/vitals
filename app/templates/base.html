<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Vitals{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: { colors: {
    bg: '#0a0a0b', panel: '#141416', border: '#26262a',
    accent: '#10b981', text: '#e5e7eb', muted: '#9ca3af'
  }}}
}
</script>
<style>
  body { background: #0a0a0b; color: #e5e7eb; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif; }
</style>
</head>
<body class="min-h-screen">
{% if user %}
<nav class="border-b border-border bg-panel">
  <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
    <a href="/" class="flex items-center gap-2 text-lg font-semibold">
      <span class="text-accent">●</span> Vitals
    </a>
    <div class="flex items-center gap-6 text-sm">
      <a href="/" class="hover:text-accent">Dashboard</a>
      <a href="/reports" class="hover:text-accent">Rapports PDF</a>
      <span class="text-muted">{{ user }}</span>
      <a href="/logout" class="text-muted hover:text-red-400">Logout</a>
    </div>
  </div>
</nav>
{% endif %}
<main class="max-w-6xl mx-auto px-6 py-8">
  {% block content %}{% endblock %}
</main>
</body>
</html>
